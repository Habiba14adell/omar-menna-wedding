<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Omar & Menna</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    background:#efdfcb;
    overflow-x:hidden;
}

/* MUSIC BUTTON */

#musicBtn{
    position:fixed;
    top:20px;
    right:20px;
    z-index:9999;

    display:none;

    border:none;
    background:#c6a27b;
    color:white;

    padding:12px 18px;

    border-radius:30px;

    font-family:Garamond, serif;
    font-size:16px;

    cursor:pointer;

    box-shadow:0 4px 12px rgba(0,0,0,.15);
}

/* ========================= */
/* SECTION 1 */
/* ========================= */

.hero{
    position:relative;
    width:100%;
    height:85vh;
    overflow:hidden;
    background:#efdfcb;
}

.hero-bg{
    position:absolute;

    top:50%;
    left:65%;

    width:140%;
    height:auto;

    transform:translate(-50%,-50%);

    opacity:0;

    animation:bgFade 1.5s ease forwards;
}
.card{
    position:absolute;
    left:50%;
    top:65%;

    width:min(90vw, 500px);

    transform:translate(-50%, -50%);
    animation:

    cardRise 1.7s ease forwards,

}
/* .card{
    position:absolute;
    left:50%;
    top:80%;

    width:min(70vw,320px);

    opacity:0;

    animation:
        cardRise 1.7s ease forwards,
        floatCard 4s ease-in-out infinite 2s;
} */
/* .card{
    position:absolute;

    left:50%;
    top:50%;

    width:min(92vw,520px);

    opacity:0;

    animation:
        cardRise 1.7s ease forwards,
        floatCard 4s ease-in-out infinite 2s;
} */

/* ========================= */
/* SECTION 2 */
/* ========================= */

.location-section{
    min-height:100vh;
    display:flex;
    background:#efdfcb;
}

.location-content{
    width:50%;

    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;

    text-align:center;

    padding:60px;

    gap:30px; /* controls spacing */
}

.location-content h2{
    font-family:Garamond, serif;
    color:#8b1111;
    font-size:48px;
    font-weight:400;
    line-height:1.15;
    margin:0;

}

.divider-image{
    width:500px;
    margin:0;
}

.location-icon{
    width:90px;
    margin-bottom:25px;
}


.venue{
    font-family:Garamond, serif;
    color:#8b1111;
    font-size:32px;
    line-height:1.3;
    margin:0;
    margin-top:-130px;

}
.location-btn{
    background:#7a5631;
    color:white;
    text-decoration:none;
    padding:14px 36px;
    font-size:20px;
    font-family:Garamond, serif;
    border-radius:40px;
    transition:.3s;
}

.location-btn:hover{
    transform:translateY(-3px);
}

.pin-icon{
    width:24px;
    height:24px;
}

.location-image{
    width:50%;
}

.location-image img{
    width:100%;
    height:100%;
    object-fit:cover;
    filter:brightness(.96);

}

/* ========================= */
/* MOBILE */
/* ========================= */
@media(max-width:768px){

    .hero{
        height:100vh;
        position:relative;
        overflow:hidden;
    }

    .hero-bg{
        position:absolute;

        left:50%;
        top:70%;

        width:180%;


        transform:translate(-50%,-50%);
    }

    .card{
        position:absolute;

        left:50%;
        top:75%;

        width:120vw;
        max-width:1800px;

        z-index:20;
    }


    .location-section{
        flex-direction:column;
        min-height:auto;
    }

    .location-content{
        width:100%;
        min-height:auto;
        padding:60px 25px;
    }

    .location-image{
        width:100%;
        height:auto;
    }

    .location-image img{
        width:100%;
        height:auto;
        display:block;
    }

    .location-content h2{
        font-size:36px;
    }

    .divider-image{
        width:350px;
        margin-top:-130px;

    }

    .venue{
        font-size:24px;
        margin-top:-140px;

    }

    .location-btn{
        font-size:18px;
        padding:14px 30px;
    }
}

/* ========================= */
/* ANIMATIONS */
/* ========================= */

@keyframes bgFade{

    from{
        opacity:0;
    }

    to{
        opacity:1;
    }

}

@keyframes cardRise{

    0%{
        opacity:0;
        transform:translate(-50%,200px) scale(.85);
    }

    70%{
        opacity:1;
        transform:translate(-50%,-10px) scale(1.03);
    }

    100%{
        opacity:1;
        transform:translate(-50%,0) scale(1);
    }

}

@keyframes floatCard{

    0%,100%{
        transform:translate(-50%,0);
    }

    50%{
        transform:translate(-50%,-8px);
    }

}

</style>
</head>

<body>

<!-- MUSIC -->

<audio id="bgMusic" loop>
    <source src="open.mp3" type="audio/mpeg">
</audio>

<button id="musicBtn">
    ♪ Play Music
</button>

<!-- SECTION 1 -->

<section class="hero">

    <img
        src="mosque-bg.png"
        class="hero-bg"
        alt="Mosque Background"
    >

    <img
        src="card-flower.png"
        class="card"
        alt="Omar and Menna Invitation"
    >

</section>

<!-- SECTION 2 -->

<section class="location-section">

    <div class="location-content">

        <h2>
            Where Our Story<br>
            Continues
        </h2>

        <img
            src="divider.png"
            class="divider-image"
            alt=""
        >

        <img
            src="location-icon.png"
            class="location-icon"
            alt=""
        >

        <p class="venue">
            Saladin Citadel Mosque<br>
            Cairo
        </p>

        <a
            href="https://maps.app.goo.gl/QTxBEU9CLJmhvfPF8"
            target="_blank"
            class="location-btn">

            <img
                src="location-pin.png"
                class="pin-icon"
                alt=""
            >

            Location

        </a>

    </div>

    <div class="location-image">

        <img
            src="location-bg.png"
            alt="Mosque"
        >

    </div>

</section>

<script>

const bgMusic = document.getElementById("bgMusic");
const musicBtn = document.getElementById("musicBtn");

window.addEventListener("load", () => {

    bgMusic.volume = 0.4;

    bgMusic.play()
        .catch(() => {

            musicBtn.style.display = "block";

        });

});

musicBtn.addEventListener("click", () => {

    bgMusic.play();

    musicBtn.innerHTML = "♪ Music Playing";

    setTimeout(() => {

        musicBtn.style.display = "none";

    }, 1000);

});

</script>

</body>
</html>
