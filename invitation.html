<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Omar & Menna</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    background:#efdfcb;
    overflow-x:hidden;
}

/* MUSIC BUTTON */

#musicBtn{
    position:fixed;
    top:20px;
    right:20px;
    z-index:9999;

    display:none;

    border:none;
    background:#c6a27b;
    color:white;

    padding:12px 18px;

    border-radius:30px;

    font-family:Garamond, serif;
    font-size:16px;

    cursor:pointer;

    box-shadow:0 4px 12px rgba(0,0,0,.15);
}

/* ========================= */
/* SECTION 1 */
/* ========================= */

.hero{
    position:relative;
    width:100%;
    height:85vh;
    overflow:hidden;
    background:#efdfcb;
}

.hero-bg{
    position:absolute;

    top:50%;
    left:65%;

    width:140%;
    height:auto;

    transform:translate(-50%,-50%);

    opacity:0;

    animation:bgFade 1.5s ease forwards;
}
.card{
    position:absolute;
    left:50%;
    top:65%;

    width:min(90vw, 500px);

    transform:translate(-50%, -50%);
    animation:
        cardRise 1.7s ease forwards,
        /* floatCard 4s ease-in-out infinite 2s; */

}

/* ========================= */
/* SECTION 2 */
/* ========================= */

.location-section{
    min-height:100vh;
    display:flex;
    background:#efdfcb;
}

.location-content{
    width:50%;

    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;

    text-align:center;

    padding:60px;

    gap:30px; /* controls spacing */
}

.location-content h2{
    font-family:Garamond, serif;
    color:#8b1111;
    font-size:48px;
    font-weight:400;
    line-height:1.15;
    margin:0;

}

.divider-image{
    width:500px;
    margin:0;
}

.location-icon{
    width:90px;
    margin-bottom:25px;
}


.venue{
    font-family:Garamond, serif;
    color:#8b1111;
    font-size:32px;
    line-height:1.3;
    margin:0;
    margin-top:-130px;

}
.location-btn{
    background:#7a5631;
    color:white;
    text-decoration:none;
    padding:14px 36px;
    font-size:20px;
    font-family:Garamond, serif;
    border-radius:40px;
    transition:.3s;
}

.location-btn:hover{
    transform:translateY(-3px);
}

.pin-icon{
    width:24px;
    height:24px;
}

.location-image{
    width:50%;
}

.location-image img{
    width:100%;
    height:100%;
    object-fit:cover;
    filter:brightness(.96);

}
/* ========================= */
/* SAVE THE DATE */
/* ========================= */

.save-date{
    min-height:100vh;
    background:#f3d9b8;

    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;

    text-align:center;

    padding:22px 20px;
}

.save-date-panel{
    width:min(870px, 100%);
    min-height:580px;

    background:#f9ead8;

    display:flex;
    flex-direction:column;
    align-items:center;

    padding:42px 24px 56px;
}

.save-date h2{
    font-family:Garamond, serif;
    color:#8b1111;
    font-size:72px;
    font-weight:400;

    margin-bottom:20px;
}

.countdown{
    display:flex;
    gap:30px;
    justify-content:center;
    align-items:center;
    flex-wrap:wrap;

    margin:50px 0;
}

.countdown div{
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;

    width:138px;
    height:156px;

    background:#fff;
    border-radius:24px;
    box-shadow:0 14px 30px rgba(122,86,49,.12);
}

.countdown span{
    font-family:Garamond, serif;
    font-weight:bold;
    color:#70472e;
    font-size:40px;
    line-height:1;
    margin-bottom:22px;
}

.countdown small{
    font-family:Arial, sans-serif;
    color:#70472e;
    font-weight:400;
    letter-spacing:0;
    font-size:20px;
}

.date-row,
.time-row{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:0;

    color:#8b1111;
    font-family:Garamond, serif;
    font-weight:bold;
    font-size:0;
    line-height:1;
}

.date-row{
    margin:18px 0 24px;
}

.time-row{
    margin:0;
}

.date-row::before,
.time-row::before{
    content:"";
    width:36px;
    height:36px;
    flex:0 0 auto;
    margin-right:14px;
}

.date-row::before{
    border:2px solid #b44935;
    border-radius:4px;
    background:
        linear-gradient(#b44935,#b44935) 5px 8px / 22px 2px no-repeat,
        linear-gradient(#b44935,#b44935) 10px 17px / 14px 2px no-repeat,
        linear-gradient(#b44935,#b44935) 17px 17px / 2px 9px no-repeat;
}

.time-row::before{
    border:2px solid #b44935;
    border-radius:50%;
    background:
        linear-gradient(#b44935,#b44935) 16px 8px / 2px 11px no-repeat,
        linear-gradient(35deg, transparent 0 47%, #b44935 48% 55%, transparent 56%) 17px 16px / 12px 12px no-repeat;
}

.date-row span,
.time-row span{
    margin-left:0;
}

.date-row span{
    font-size:42px;
}

.time-row span{
    font-size:30px;
}
/* ========================= */
/* SECTION 4 - PARKING */
/* ========================= */

.parking-section{
    position:relative;
    min-height:100vh;
    overflow:hidden;

    display:flex;
    justify-content:center;
    align-items:center;

    text-align:center;
}

.parking-bg{
    position:absolute;
    inset:0;

    width:100%;
    height:100%;

    object-fit:cover;
}

.parking-content{
    position:relative;
    z-index:2;

    max-width:600px;
}

.parking-content h2{
    font-family:Garamond, serif;
    color:#8b1111;
    font-size:72px;
    margin-bottom:20px;
}

.parking-divider{
    width:250px;
    margin-bottom:40px;
}

.parking-content p{
    font-family:Garamond, serif;
    color:#8b1111;
    font-size:26px;
    line-height:1.6;

    margin-bottom:50px;
}

/* GOLF CART */

.golf-cart{
    position:absolute;

    bottom:40px;
    left:-400px;

    width:320px;

    z-index:3;

    animation:golfDrive 6s ease-out forwards;
}
/* ========================= */
/* MOBILE */
/* ========================= */
@media(max-width:768px){

    .hero{
        height:100vh;
        position:relative;
        overflow:hidden;
    }

    .hero-bg{
        position:absolute;

        left:50%;
        top:70%;

        width:180%;


        transform:translate(-50%,-50%);
    }

    .card{
        position:absolute;

        left:50%;
        top:75%;

        width:120vw;
        max-width:1800px;

        z-index:20;
    }


    .location-section{
        flex-direction:column;
        min-height:auto;
    }

    .location-content{
        width:100%;
        min-height:auto;
        padding:60px 25px;
    }

    .location-image{
        width:100%;
        height:auto;
    }

    .location-image img{
        width:110%;
        height:auto;
        display:block;
    }

    .location-content h2{
        font-size:36px;
    }

    .divider-image{
        width:350px;
        margin-top:-130px;

    }

    .venue{
        font-size:24px;
        margin-top:-180px;

    }

    .location-btn{
        font-size:18px;
        padding:14px 30px;
    }
    .save-date{
        padding:18px 14px;
    }

    .save-date-panel{
        min-height:auto;
        padding:34px 14px 42px;
    }

    .save-date h2{
        font-size:44px;
        margin-top:0;
        margin-bottom:18px;
    }

    .save-date .divider-image{
        width:380px;
        margin-top:-90px;
    }

    .countdown{
        gap:15px;
        margin:-45px 0 26px;


    }

    .countdown div{
        width:78px;
        height:96px;
        border-radius:18px;
    }

    .countdown span{
        font-size:28px;
        margin-bottom:12px;
    }

    .countdown small{
        font-size:13px;
    }

    .date-row span{
        font-size:28px;
    }

    .time-row span{
        font-size:22px;
    }

    .date-row::before,
    .time-row::before{
        width:30px;
        height:30px;
    }

    .date-row{
        margin:8px 0 20px;
    }

}

/* ========================= */
/* ANIMATIONS */
/* ========================= */
@keyframes golfDrive{

    from{
        left:-400px;
    }

    to{
        left:55%;
    }

}
@keyframes bgFade{

    from{
        opacity:0;
    }

    to{
        opacity:1;
    }

}

@keyframes cardRise{

    0%{
        opacity:0;
        transform:translate(-50%,200px) scale(.85);
    }

    70%{
        opacity:1;
        transform:translate(-50%,-10px) scale(1.03);
    }

    100%{
        opacity:1;
        transform:translate(-50%,0) scale(1);
    }

}

@keyframes floatCard{

    0%,100%{
        transform:translate(-50%,0);
    }

    50%{
        transform:translate(-50%,-8px);
    }

}

</style>
</head>

<body>

<!-- MUSIC -->

<audio id="bgMusic" loop>
    <source src="open.mp3" type="audio/mpeg">
</audio>

<button id="musicBtn">
    ♪ Play Music
</button>

<!-- SECTION 1 -->

<section class="hero">

    <img
        src="mosque-bg.png"
        class="hero-bg"
        alt="Mosque Background"
    >

    <img
        src="card-flower.png"
        class="card"
        alt="Omar and Menna Invitation"
    >

</section>

<!-- SECTION 2 -->

<section class="location-section">

    <div class="location-content">

        <h2>
            Where Our Story<br>
            Continues
        </h2>

        <img
            src="divider.png"
            class="divider-image"
            alt=""
        >

        <img
            src="location-icon.png"
            class="location-icon"
            alt=""
        >

        <p class="venue">
            Saladin Citadel Mosque<br>
            Cairo
        </p>

        <a
            href="https://maps.app.goo.gl/QTxBEU9CLJmhvfPF8"
            target="_blank"
            class="location-btn">

            <img
                src="location-pin.png"
                class="pin-icon"
                alt=""
            >
            Location

        </a>

    </div>

    <div class="location-image">

        <img
            src="location-bg.png"
            alt="Mosque"
        >

    </div>

<!-- SECTION 3 -->
</section>

<section class="save-date">

    <div class="save-date-panel">

    <h2>SAVE THE DATE</h2>

    <img src="divider.png" class="divider-image" alt="divider">

    <div id="countdown" class="countdown">
        <div>
            <span id="days">00</span>
            <small>Days</small>
        </div>

        <div>
            <span id="hours">00</span>
            <small>Hours</small>
        </div>

        <div>
            <span id="minutes">00</span>
            <small>Minutes</small>
        </div>

        <div>
            <span id="seconds">00</span>
            <small>Seconds</small>
        </div>
    </div>

    <div class="date-row">
        ✦ <span>17.07.2026</span>
    </div>

    <div class="time-row">
        ✦  <span>5:00 PM</span>
    </div>

    </div>

<!-- SECTION 4 -->
</section>
<section class="parking-section">

    <img src="parking-bg.png" class="parking-bg" alt="">

    <div class="parking-content">

        <h2>PARKING</h2>

        <img src="divider.png" class="parking-divider" alt="">

        <p>
            Guest parking will be available<br>
            at the designated location.
        </p>

        <p>
            A golf car will be available<br>
            to take you to The<br>
            Muhammad Ali Mosque
        </p>

    </div>

    <img src="golf-car.png"
         class="golf-cart"
         alt="Golf Cart">

</section>

<script>

const bgMusic = document.getElementById("bgMusic");
const musicBtn = document.getElementById("musicBtn");

window.addEventListener("load", () => {

    bgMusic.volume = 0.4;

    bgMusic.play()
        .catch(() => {

            musicBtn.style.display = "block";

        });

});


musicBtn.addEventListener("click", () => {

    bgMusic.play();

    musicBtn.innerHTML = "♪ Music Playing";

    setTimeout(() => {

        musicBtn.style.display = "none";

    }, 1000);

});

/* COUNTDOWN CODE */

const weddingDate = new Date("2026-07-17T17:00:00").getTime();

function updateCountdown(){

    const now = new Date().getTime();
    const distance = weddingDate - now;

    const days = Math.floor(
        distance / (1000 * 60 * 60 * 24)
    );

    const hours = Math.floor(
        (distance % (1000 * 60 * 60 * 24))
        / (1000 * 60 * 60)
    );

    const minutes = Math.floor(
        (distance % (1000 * 60 * 60))
        / (1000 * 60)
    );

    const seconds = Math.floor(
        (distance % (1000 * 60))
        / 1000
    );

    document.getElementById("days").textContent = days;
    document.getElementById("hours").textContent = hours;
    document.getElementById("minutes").textContent = minutes;
    document.getElementById("seconds").textContent = seconds;
}

updateCountdown();
setInterval(updateCountdown, 1000);
</script>

</body>
</html>
