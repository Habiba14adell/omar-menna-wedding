<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Omar & Menna</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#efdfcb;
    min-height:100vh;

    display:flex;
    justify-content:center;
    align-items:center;

    overflow:hidden;
}

.container{
    position:relative;
    width:92vw;
    max-width:700px;
}

.envelope{
    width:100%;
    display:block;
}

.stamp{
    position:absolute;

    left:50%;
    top:82%;

    transform:translate(-50%,-50%);

    width:9vw;
    min-width:40px;
    max-width:60px;

    cursor:pointer;
    transition:0.3s ease;
}

.stamp:hover{
    transform:translate(-50%,-50%) scale(1.08);
}

.message{
    position:absolute;

    left:50%;
    top:97%;

    transform:translateX(-50%);

    font-family:Garamond, serif;
    font-size:clamp(18px,4vw,30px);

    color:#c5aa88;

    white-space:nowrap;
}

@media (max-width:480px){

    .container{
        width:92vw;
    }

    .stamp{
        width:11vw;
    }

    .message{
        font-size:20px;
    }
}

</style>
</head>

<body>

<div class="container">

    <img
        src="envelope.png"
        alt="Envelope"
        class="envelope"
    >

    <img
        src="stamp.png"
        alt="Stamp"
        class="stamp"
        onclick="openInvitation()"
    >

    <div class="message">
        Open with care... Forever is inside
    </div>

</div>

<audio id="sealSound">
    <source src="open.mp3" type="audio/mpeg">
</audio>

<script>

function openInvitation(){

    const sound = document.getElementById("sealSound");

    sound.play();

    setTimeout(() => {
        window.location.href = "invitation.html";
    }, 1200);

}

</script>

</body>
</html>
