<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Omar & Menna</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#efdfcb;
    overflow:hidden;
}

.wrapper{
    position:relative;
    width:100vw;
    height:100vh;
}

.landing{
    width:100%;
    height:100%;
    object-fit:contain;
    display:block;
}

/* Invisible clickable seal area */
.stamp-button{
    position:absolute;

    left:50%;
    top:61%;

    transform:translate(-50%,-50%);

    width:90px;
    height:90px;

    cursor:pointer;

    background:transparent;
    border:none;
}

@media (max-width:768px){

    .stamp-button{
        width:80px;
        height:80px;
    }

}

</style>
</head>

<body>

<div class="wrapper">

    <img
        src="landing-page.png"
        class="landing"
        alt="Wedding Invitation"
    >

    <button
        class="stamp-button"
        onclick="openInvitation()"
        aria-label="Open Invitation">
    </button>

</div>

<audio id="sealSound">
    <source src="open.mp3" type="audio/mpeg">
</audio>

<script>

function openInvitation(){

    const sound = document.getElementById("sealSound");

    sound.play();

    setTimeout(() => {
        window.location.href = "invitation.html";
    }, 1200);

}

</script>

</body>
</html>
